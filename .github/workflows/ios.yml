name: Build iPhone demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          bash generate-project.sh
      - name: Choose available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for rows in devices.values() for d in rows if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run availability and date tests
        run: |
          xcodebuild test -project MajedLive.xcodeproj -scheme MajedLive \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Capture native iPhone screen
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/MajedLive.app
          xcrun simctl launch "$SIMULATOR_ID" com.majedlive.demo.iphone
          sleep 12
          xcrun simctl io "$SIMULATOR_ID" screenshot build/iPhone-preview.png
      - name: Build unsigned iPhone app
        run: |
          xcodebuild build -project MajedLive.xcodeproj -scheme MajedLive \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/MajedLive.app build/package/Payload/
          cd build/package
          zip -qr ../MajedLive.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MajedLive-unsigned-IPA
          path: build/MajedLive.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct IPA for TrollStore updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="build-$GITHUB_RUN_NUMBER"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/MajedLive.ipa --clobber
          else
            gh release create "$RELEASE_TAG" build/MajedLive.ipa \
              --target "$GITHUB_SHA" --title "MajedLive demo $GITHUB_RUN_NUMBER" \
              --notes "نسخة تجريبية لماجد لايف. يمكن تثبيتها وتحديثها باستخدام TrollStore." --latest
          fi
      - name: Upload iPhone preview
        uses: actions/upload-artifact@v4
        with:
          name: MajedLive-iPhone-preview
          path: build/iPhone-preview.png
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MajedLive-tests
          path: build/Tests.xcresult
